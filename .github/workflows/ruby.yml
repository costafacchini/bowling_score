name: "Ruby CI"
on:
  push:
    branches: '*'
  pull_request:
    branches: '*'
jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Lint Ruby files
        run: bundle exec rubocop
      - name: Run tests (RSpec)
        run: bundle exec rspec
