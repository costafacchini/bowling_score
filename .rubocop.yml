require: rubocop-rspec

plugins:
  - rubocop-performance
  - rubocop-rake

AllCops:
  Exclude:
    - 'spec/fixtures/**/*'
  NewCops: enable

Style/BlockComments:
  Exclude:
    - 'spec/spec_helper.rb'

Style/FrozenStringLiteralComment:
  Enabled: false

Style/Documentation:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - spec/**/*

RSpec/RepeatedExampleGroupBody:
  Enabled: false

RSpec/MultipleExpectations:
  Enabled: false

RSpec/ExampleLength:
  Max: 15

RSpec/NestedGroups:
  Max: 4
